name: 🐛 Bug Report
description: Report unexpected behavior, false VERIFIED/FAILED verdicts, or test execution errors.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When running 'agent-verify verify' on a repo with..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this? (Commands, minimal diff, or sample claim)
      placeholder: |
        1. Run 'agent-verify verify --repo ...'
        2. Provide claim: ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, agent-verify version.
      placeholder: |
        - OS: Windows 11 / Ubuntu 24.04 / macOS Sequoia
        - Python Version: 3.12
        - agent-verify Version: 0.1.0
    validations:
      required: true
