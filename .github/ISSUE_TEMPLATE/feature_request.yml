name: ✨ Feature Request
description: Propose a new check engine, framework runner, or reporting feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make AI agent verification stronger or more developer-friendly? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or user problem?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "Add support for TypeScript AST parsing via..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - "Checks (Diff, Test, Scope, Spec)"
        - "CLI Interface"
        - "MCP Server"
        - "Call Graph & Blast Radius"
        - "Reporting (Rich, JSON, Markdown)"
        - "Git Hooks & CI/CD"
        - "Other"
    validations:
      required: true
